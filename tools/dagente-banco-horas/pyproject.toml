[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagente-banco-horas"
version = "1.0.0"
description = "Tool LangChain para consulta de banco de horas no portal DaGente (Localiza)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "msal>=1.28.0",
    "requests>=2.31.0",
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
keyring = [
    "keyring>=25.0.0",
]

[project.scripts]
dagente-banco-horas = "dagente_banco_horas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que exigem credenciais e rede real",
]
